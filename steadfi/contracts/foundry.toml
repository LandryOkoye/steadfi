[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
]

[profile.default.fuzz]
runs = 1000
seed = "0xdeadbeef"

[profile.default.invariant]
runs = 500
depth = 50
fail_on_revert = false

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC}"
arc_mainnet = "${ARC_MAINNET_RPC}"

[etherscan]
arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "https://testnet.arcscan.app/api" }
arc_mainnet = { key = "${ARCSCAN_API_KEY}", url = "https://explorer.arc.io/api" }
